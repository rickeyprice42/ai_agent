# This file is installed by enable_public_domain.sh after the certificate exists.
limit_req_zone $binary_remote_addr zone=avelin_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name avelin.tech www.avelin.tech app.avelin.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Bind only the public IPv4 address so Tailscale Serve can keep using
    # port 443 on the separate Tailscale interface.
    listen 78.40.199.9:443 ssl;
    http2 on;
    server_name www.avelin.tech;

    ssl_certificate /etc/letsencrypt/live/avelin.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avelin.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AVELIN_SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://avelin.tech$request_uri;
}

server {
    listen 78.40.199.9:443 ssl;
    http2 on;
    server_name avelin.tech;
    root /opt/avelin/current/website;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/avelin.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avelin.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AVELIN_SSL:10m;
    ssl_session_timeout 1d;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}

server {
    listen 78.40.199.9:443 ssl;
    http2 on;
    server_name app.avelin.tech;
    root /opt/avelin/current/frontend/dist;
    index index.html;
    client_max_body_size 55m;
    limit_req_status 429;

    ssl_certificate /etc/letsencrypt/live/avelin.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avelin.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AVELIN_SSL:10m;
    ssl_session_timeout 1d;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=avelin_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}

# Keep the private Tailscale origin available for maintenance and test releases.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /opt/avelin/current/frontend/dist;
    index index.html;
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
